  <style>/* ---- styles/base.css ---- */
/* =========================================================
   DESIGN-TOKENS (Dark Mode)
   ========================================================= */
:root {
  --bg:          #0d1117;
  --bg-elev:     #161b22;
  --bg-elev-2:   #1f2630;
  --border:      #2a323d;
  --text:        #e6edf3;
  --text-muted:  #8b949e;
  --accent:      #3b82f6;
  --accent-2:    #22d3ee;
  --accent-soft: rgba(59, 130, 246, 0.14);
  --danger:      #f85149;
  --success:     #3fb950;
  --radius:      14px;
  --radius-sm:   8px;
  --shadow:      0 10px 30px rgba(0, 0, 0, 0.35);
  --header-h:    60px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .6rem 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-elev-2);
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover  { background: #28313d; border-color: #3a4552; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn-primary:hover { background: #2f6fe0; border-color: #2f6fe0; }
.btn svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ---- styles/login.css ---- */
/* =========================================================
   1) LOGIN-OVERLAY
   ========================================================= */
#login-overlay {
  position: fixed; inset: 0; z-index: 1000;
  display: grid; place-items: center;
  padding: 1rem;
  background:
    radial-gradient(circle at 20% 20%, rgba(59,130,246,.18), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(34,211,238,.12), transparent 45%),
    var(--bg);
}
.login-card {
  width: 100%; max-width: 380px;
  padding: 2rem 1.75rem;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  text-align: center;
}
.login-card .logo { width: 56px; height: 56px; margin: 0 auto 1rem; color: var(--accent); }
.login-card p { color: var(--text-muted); margin: 0 0 1.5rem; font-size: .95rem; }
.login-card form { display: grid; gap: .75rem; }
.login-card input {
  width: 100%;
  padding: .75rem .9rem;
  font: inherit; font-size: 16px; /* 16px verhindert Auto-Zoom auf iOS */
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.login-card input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.login-card .btn-primary { justify-content: center; padding: .75rem; }
.login-error { min-height: 1.4em; color: var(--danger); font-size: .9rem; }
.shake { animation: shake .35s; }
@keyframes shake {
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}
</style>
</head>

    <div class="login-card" id="login-card">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      </svg>
      <h1 id="login-title">Lernplattform</h1>
      <p>Bitte gib das Klassen-Passwort ein.</p>
      <form id="login-form" autocomplete="off">
        <label for="login-password" class="sr-only">Passwort</label>
        <input type="password" id="login-password" placeholder="Passwort" required autofocus>
        <button type="submit" class="btn btn-primary" id="login-submit">Anmelden</button>
        <div class="login-error" id="login-error" role="alert"></div>
      </form>
    </div>
  </div>

  <script>/* ============================================================
   Login und Entschlüsselung (läuft auf der öffentlichen Seite)

   Die Lernplattform ist beim Build mit AES-256-GCM verschlüsselt worden.
   Der Schlüssel wird aus dem Passwort abgeleitet (PBKDF2-SHA-256 mit
   vielen Durchläufen, damit Raten teuer ist). Im Quelltext der Seite
   steht weder das Passwort noch ein Hash davon – nur verschlüsselte Daten.
   Falsches Passwort = Entschlüsselung schlägt fehl.

   Nach dem Login merkt sich der Browser-Tab den Schlüssel in der
   sessionStorage (bis der Tab geschlossen oder abgemeldet wird).
   ============================================================ */
(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('bs-data').textContent);
  const STORE = 'bs-key';
  const $ = s => document.querySelector(s);
  const b64decode = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64encode = bytes => btoa(String.fromCharCode(...bytes));

  async function deriveKey(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64decode(DATA.salt), iterations: DATA.iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  async function decrypt(key, iv, bytes) {
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, bytes));
  }

  async function gunzip(bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  /* Verschlüsselte Datei (Zusammenfassung) laden: files/<id>.bin = 12 Byte IV + Geheimtext */
  async function loadFile(key, files, path) {
    const entry = files[path];
    if (!entry) throw new Error('Unbekannte Datei: ' + path);
    const res = await fetch(`files/${entry.id}.bin`, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = new Uint8Array(await res.arrayBuffer());
    const plain = await decrypt(key, raw.slice(0, 12), raw.slice(12));
    return { blob: new File([plain], entry.name, { type: entry.type }), name: entry.name };
  }

  function logout() {
    try { sessionStorage.removeItem(STORE); } catch { /* privater Modus */ }
    location.reload();
  }

  /* Entschlüsselt die App und startet sie. Wirft bei falschem Schlüssel. */
  async function openApp(key) {
    const json = new TextDecoder().decode(await gunzip(await decrypt(key, b64decode(DATA.iv), b64decode(DATA.data))));
    const app = JSON.parse(json);
    window.BS = { logout, file: path => loadFile(key, app.files, path) };
    const style = document.createElement('style');
    style.textContent = app.css;
    document.head.append(style);
    $('#login-overlay').remove();
    document.body.insertAdjacentHTML('afterbegin', app.html);
    const script = document.createElement('script');
    script.textContent = app.js;
    document.body.append(script);
  }

  function showError(text) {
    $('#login-error').textContent = text;
    const card = $('#login-card');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }

  const supported = !!(window.crypto && crypto.subtle && window.DecompressionStream);

  $('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = $('#login-password'), button = $('#login-submit');
    $('#login-error').textContent = '';
    if (!supported) return showError('Dein Browser ist zu alt für die verschlüsselte Seite. Bitte aktualisiere ihn.');
    button.disabled = true; button.textContent = 'Wird entschlüsselt …';
    try {
      const key = await deriveKey(input.value);
      await openApp(key);
      try { sessionStorage.setItem(STORE, b64encode(new Uint8Array(await crypto.subtle.exportKey('raw', key)))); } catch { /* privater Modus */ }
    } catch (err) {
      if (err && err.name !== 'OperationError') console.error(err);
      button.disabled = false; button.textContent = 'Anmelden';
      showError('Falsches Passwort. Bitte erneut versuchen.');
      input.select();
    }
  });

  /* Schon angemeldet (gleicher Tab)? Dann direkt öffnen. */
  (async () => {
    let stored = null;
    try { stored = sessionStorage.getItem(STORE); } catch { /* privater Modus */ }
    if (!stored || !supported) return;
    try {
      const key = await crypto.subtle.importKey('raw', b64decode(stored), 'AES-GCM', true, ['decrypt']);
      await openApp(key);
    } catch {
      try { sessionStorage.removeItem(STORE); } catch { /* egal */ }   // z. B. neues Passwort seit dem letzten Besuch
    }
  })();
})();
</script>
</body>
</html>
